# —— ②a 纯 I 集（set=intra，施工图② I 帧闭环对拍用）：——
# 实测（2026-10-24，本机 ffmpeg）：45/45 帧 pict_type=I 且 key_frame=1，
# profile=Constrained Baseline（176×144/640×360/1280×720 level 分别为
# 1.0/2.2/3.1）。配方说明见清单头注（`-intra` → `-g 1` 等价替换）。
#
# 2026-10-25 增补（②a 施工商登记）：配方追加 `-x264-params no-deblock=1`
# 并重生成（sha256 实测更新）。理由：施工图②把 deblocking 放在 ②c
# （deblock.rs 由第二人在 ②a 数据结构冻结后实现），②a 闭环不含环路
# 滤波——片头 disable_deblocking_filter_idc 必须为 1（禁用）才能逐帧
# 对拍；原配方带滤波（idc=0）对无滤波解码器结构性不可过界。向量名、
# 分辨率、GOP 结构不变（45×I，Constrained Baseline，实测如上）。

[[vector]]
name = "h264-intra-testsrc2-176x144"
codec = "h264"
container = "mp4"
set = "intra"
generate = "ffmpeg -y -v error -f lavfi -i testsrc2=size=176x144:rate=15 -t 3 -c:v libx264 -profile:v baseline -g 1 -x264-params no-deblock=1 -pix_fmt yuv420p -movflags +faststart {OUT}"
ffmpeg_version = "ffmpeg version N-123627-g5dfe661f03-20260327 Copyright (c) 2000-2026 the FFmpeg developers"
sha256 = "d2c40ccda28c03ed34676f40125f059f8f7f3a5c8c78747f3a131e253dc40869"

