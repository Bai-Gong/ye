generate = "ffmpeg -y -v error -f lavfi -i testsrc2=size=176x144:rate=15 -t 3 -c:v libx264 -profile:v baseline -g 15 -x264-params no-deblock=1 -pix_fmt yuv420p -movflags +faststart {OUT}"
ffmpeg_version = "ffmpeg version N-123627-g5dfe661f03-20260327 Copyright (c) 2000-2026 the FFmpeg developers"
