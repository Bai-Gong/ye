# —— 解码器分歧修复回归集（set=ip30，2026-10-27 施工登记）——
# 理由：既有 intra/ip 集全部 no-deblock=1、15fps 45 帧（GOP 15），从未
# 覆盖「去块启用」与「30fps 90 帧单 GOP 长链（ref=3、frame_num 5 次
# 回绕）」形态——2026-10-27 在 §3.1 冻结配方（m2-jian-plan：testsrc2
# 320x240@30 baseline 3s）上实测暴露两处独立分歧（去块启用首差帧 0
# luma：解码期行内去块使帧内预测读到滤波后样本 + chroma QP 漏加
# PPS 偏移；关去块首差帧 81 chroma：pred_8x16 n=1 捷径缺 C→D 回退），
# 修复后 deblock 条 90 帧逐位一致（max_abs=0）、nodeblock 条 max_abs=1
# （帧 81 起 Cr 平面孤立 ±1 样本，300 帧扩展实测 24 帧 × 每帧 ≤2 样本，
# 施工图②容差内；二轮复核已排除 MC/参考选择/反量化/idct 语义，归档
# 为 ffmpeg 内部舍入边角——详见 conformance.rs ip30 注释）。两条配方即
# §3.1 冻结配方与其关去块变体（duan binaries ffmpeg N-127696 生成，
# sha256 实测）。修复前复测记录：deblock 条 max_abs=74（首差帧 0
# luma）、nodeblock 条 max_abs=76（首差帧 81 chroma）。

