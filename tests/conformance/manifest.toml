# ye 一致性测试向量清单 v1（清单入库、向量二进制不入库）。
#
# 2026-10-24 施工图①裁决落地：
# - 就位集（[[vector]]，6 条）：外网被墙（curl test-videos.co.uk /
#   samples.ffmpeg.org 均 code=000）无法下载 FATE 向量，按裁决以本机
#   ffmpeg + 确定性 lavfi 源自造（176×144/640×360/1280×720 ×
#   testsrc2/smptebars）。smptebars 为「真实素材转码」项的替代——无
#   外网素材源，选确定性测试图替代并在本清单登记。
# - 每条记完整生成命令（{OUT} 为缓存路径占位）、ffmpeg 版本与实测
#   SHA256（sha 只准实测，禁止推测值）。
# - 待网络清册（[[pending_vector]]）：FFmpeg FATE H.264 conformance 的
#   Baseline 子集（ba*/B* 系列）。本机外网被墙无法下载计算实测
#   SHA256，按裁决登记不进 ran/skipped 计数、不参与终验断言，摘要行
#   另落 pending=K；网络恢复后实测 sha256 并升入 [[vector]]。
# - 增删向量须登记理由，选择权不在施工方（施工图 risks 第 13 条）。

manifest_version = 1

# —— 就位集：testsrc2（含运动，跨三档分辨率）——

[[vector]]
name = "h264-testsrc2-176x144"
codec = "h264"
container = "mp4"
generate = "ffmpeg -y -v error -f lavfi -i testsrc2=size=176x144:rate=15 -t 3 -c:v libx264 -profile:v baseline -pix_fmt yuv420p -movflags +faststart {OUT}"
ffmpeg_version = "ffmpeg version N-123627-g5dfe661f03-20260327 Copyright (c) 2000-2026 the FFmpeg developers"
sha256 = "2f21dee9a195bd1168888598c1139bf7297acd3ac601df241f3fad1fbadf55cb"

