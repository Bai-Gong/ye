[package]
name = "ye"
description = "百工·冶：对标 FFmpeg 的媒体编解码与处理基础库（门面 crate）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ye-time = { path = "../ye-time" }
ye-pixfmt = { path = "../ye-pixfmt" }
ye-codec = { path = "../ye-codec" }
ye-container = { path = "../ye-container" }
ye-container-mp4 = { path = "../ye-container-mp4", optional = true }
ye-filter = { path = "../ye-filter" }
ye-device = { path = "../ye-device" }
ye-codec-h264 = { path = "../ye-codec-h264", optional = true }
ye-codec-aac = { path = "../ye-codec-aac", optional = true }

[features]
default = ["mp4"]
# 容器：MP4 解封装与封装（ye-container-mp4，含 Demuxer/Muxer trait 接线）。
# 2026-10-24 合流（B 案）后 ye-container-mp4 依赖 ye-container（契约类型），
# 抽象层反向转发会成环——feature 汇总上提到本门面，re-export 在
# src/container.rs 的 mp4 子模块（取代 m1 设想的 ye-container/mp4 链）。
mp4 = ["dep:ye-container-mp4"]
# M2+ 接口桩的门面聚合入口（src/stubs.rs）：桩本体在 ye-codec/ye-filter
# 无条件编译（尚无独立实现 crate 可作 optional 依赖裁剪），这两个
# feature 控制 ye::stubs 聚合入口——默认关闭，消费方显式开启即把
# 「本构建依赖桩」记进依赖声明（防桩悄悄进产品路径）；真实现 crate
# （ye-codec-h264 等）落地后由其 feature 取代。语义边界见
# docs/contracts.md「M2+ 接口桩契约」。
# 施工图②a：H.264 解码主链 I 帧闭环（ye-codec-h264：CAVLC 残差 →
# 反量化/反变换 → 帧内预测 → yuv420p 输出）。真实现落地后取代
# codec-stubs 里对应桩的注册位。
h264 = ["dep:ye-codec-h264"]
# 施工图③：AAC-LC 解码主链（ye-codec-aac：ADTS/LOAS/esds 入口 →
# packed f32 AudioFrame，时戳透传；含 register_aac 注册——取代
# codec-stubs 中 AAC 解码桩的位置）。
aac = ["dep:ye-codec-aac"]
codec-stubs = []
filter-stubs = []
