# `ffmpeg -f s16le`（mp4 条带 `-ignore_editlist 1`，对齐我方裸码流
# 语义——不裁 priming 帧）。工具矩阵：48k 立体声正弦（TNS 开）、
# 44.1k 单声道正弦（PNS/TNS 关）、44.1k 立体声 m4a（esds 入口）、
