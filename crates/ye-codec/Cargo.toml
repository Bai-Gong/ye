[package]
name = "ye-codec"
description = "百工·冶：编解码器抽象——Packet 与 Frame 之间的 trait 与注册表"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 注：全库约定偏好根 Cargo.toml 的 [workspace.dependencies] + `workspace = true` 写法，
# 但本轮施工范围限定为仅改本 crate 目录，故按 path 依赖直连（效果等价，无版本漂移）。
ye-time = { path = "../ye-time" }
ye-pixfmt = { path = "../ye-pixfmt" }
