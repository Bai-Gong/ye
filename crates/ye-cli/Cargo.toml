[package]
name = "ye-cli"
description = "百工·冶：`ye` 命令行——媒体探查与转码（对标 ffmpeg / ffprobe）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# default-features = false + 显式 mp4：与 contracts.md「门面与 feature
# 接线」第 3 条的声明一致——不被动继承门面未来新增的 default feature
# （当前 default 恰为 ["mp4"]，行为与此前等效）。
ye = { path = "../ye", default-features = false, features = ["mp4"] }

[lib]
name = "ye_cli"

[[bin]]
name = "ye"
path = "src/main.rs"
