[package]
name = "ye-container"
description = "百工·冶：封装/解封装抽象——Stream 与 Packet 之间的 trait 与注册表"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 具体容器实现，一律 optional，按 feature 开启（见 docs/contracts.md）。
ye-container-mp4 = { path = "../ye-container-mp4", optional = true }

[features]
# MP4 容器：解封装（progressive 与 fMP4）与封装（Mp4Writer）。
# 由 ye 门面的同名 feature 传递开启。
mp4 = ["dep:ye-container-mp4"]
