# —— ②b I/P 混合集（set=ip，施工图② P 帧全链对拍用）：——
# 实测（2026-10-24，本机 ffmpeg）：GOP=-g 15，45 帧 = 3×(1I+14P)，
# I(key_frame=1)@0/15/30、无 scenecut 插帧；profile=Constrained
# Baseline。P 帧含真实运动（testsrc2），运动补偿/参考帧链有效受压。
#
# 2026-10-25 增补（②b 施工商登记）：配方追加 `-x264-params
# no-deblock=1` 并重生成（sha256 实测更新；640x360 顺带修正源参数
# `testsrc2:size=` 笔误为 `testsrc2=size=`，与实测生成命令一致）。
# 理由同 intra 集 ②a 增补：deblocking 在 ②c 落地前，②b 闭环（帧间
# 预测/运动补偿/参考窗）无环路滤波，片头 idc 必须为 1（禁用）才可
# 逐帧对拍。向量名、GOP 结构不变（45 帧 = 3×(1I+14P)）。

